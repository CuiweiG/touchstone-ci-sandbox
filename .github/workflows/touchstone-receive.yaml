name: Continuous Benchmarks (Receive)

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

on:
  pull_request:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    if:
      true &&
      (
        github.event.pull_request.author_association == 'OWNER' ||
        github.event.pull_request.author_association == 'MEMBER' ||
        github.event.pull_request.author_association == 'COLLABORATOR'
      )
    steps:
      - run: echo "Author check passed"
  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Stands in for the touchstone receive action: same `pr` artifact,
      # outcome set by stub/mode.
      - name: Run stub benchmark
        env:
          FINISH_AT: ${{ vars.FINISH_AT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mode=$(cat stub/mode)
          echo "Mode: $mode"
          case "$mode" in
            fail)
              echo "Stub benchmark failed"
              exit 1
              ;;
            slow)
              sleep 150
              ;;
            sync)
              now=$(date +%s)
              if [ "${FINISH_AT:-0}" -gt "$now" ]; then
                sleep $((FINISH_AT - now))
              fi
              ;;
          esac
          mkdir -p touchstone/pr-comment
          echo "$PR_NUMBER" > touchstone/pr-comment/NR
          echo "Stub benchmark ($mode) for $HEAD_SHA, run $GITHUB_RUN_ID." > touchstone/pr-comment/info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr
          path: touchstone/pr-comment/
